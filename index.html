    <!-- 1. DASHBOARD DE MINERÍA PASIVA -->
    <section id="dashboard" class="view active">
        <div class="cyber-card" style="text-align: center; border-color: #00f0ff; position: relative; overflow: hidden;">
            <div style="font-size: 0.75rem; color: #94a3b8; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px;">BÓVEDA PRINCIPAL</div>
            <div style="display: flex; justify-content: center; align-items: baseline; gap: 8px;">
                <span style="font-size: 1.5rem; color: #00f0ff; font-weight: 800;">$</span>
                <span id="main-balance-usdt" style="font-size: 3rem; font-weight: 900; font-family: monospace; color: #fff; text-shadow: 0 0 15px rgba(0,240,255,0.5);">0.0000</span>
            </div>

            <!-- ANIMACIÓN DE MINERÍA EN LA NUBE -->
            <div style="margin: 30px 0; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(0,240,255,0.1);">
                <div style="font-size: 0.7rem; color: #10b981; margin-bottom: 10px; font-weight: bold;"><i class="fa-solid fa-satellite-dish fa-beat"></i> MINANDO EN CURSO</div>
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px;">
                    <i class="fa-solid fa-microchip" style="font-size: 2rem; color: #94a3b8;"></i>
                    <span id="mining-hash" style="font-size: 2.2rem; color: #ff1493; font-family: monospace; font-weight: bold; text-shadow: 0 0 10px rgba(255,20,147,0.4);">0.00</span>
                    <span style="font-size: 1rem; color: #94a3b8; font-weight: bold;">HASH</span>
                </div>
                <div id="mining-speed" style="font-size: 0.75rem; color: #00f0ff; font-family: monospace;">0 GH/s asignados al Núcleo</div>
            </div>

            <!-- BOTONES DE RECOLECCIÓN Y MISIÓN -->
            <button onclick="window.claimMining()" style="background: linear-gradient(90deg, #005f73, #00f0ff); color: #000; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 900; font-size: 0.9rem; margin-bottom: 10px; cursor: pointer; text-transform: uppercase;">
                <i class="fa-solid fa-download"></i> Recolectar Minería
            </button>
            
            <button id="daily-quest-btn" onclick="window.claimDailyQuest()" style="background: rgba(255,20,147,0.1); border: 1px solid #ff1493; color: #ff1493; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                <i class="fa-solid fa-gift"></i> Reclamar Bono Diario
            </button>
        </div>
    </section>
